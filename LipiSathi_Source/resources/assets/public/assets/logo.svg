<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle with gradient -->
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B4C9A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B4C9A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="75" r="60" fill="url(#circleGradient)" opacity="0.9"/>
  
  <!-- Network nodes around circle -->
  <circle cx="160" cy="45" r="3" fill="#1E3A5F"/>
  <circle cx="170" cy="75" r="3" fill="#1E3A5F"/>
  <circle cx="160" cy="105" r="3" fill="#1E3A5F"/>
  <circle cx="140" cy="125" r="3" fill="#1E3A5F"/>
  
  <!-- Scripts/characters decorative elements -->
  <text x="30" y="50" font-family="Arial" font-size="12" fill="#E67E50" opacity="0.7">అ</text>
  <text x="25" y="70" font-family="Arial" font-size="10" fill="#E67E50" opacity="0.6">ക</text>
  <text x="35" y="90" font-family="Arial" font-size="11" fill="#E67E50" opacity="0.7">ଏ</text>
  
  <!-- Brain/search icon -->
  <circle cx="100" cy="65" r="15" fill="white" opacity="0.9"/>
  <path d="M 95 65 Q 95 60, 100 60 Q 105 60, 105 65 Q 105 70, 100 70 Q 95 70, 95 65" fill="#1E3A5F"/>
  <circle cx="108" cy="72" r="8" fill="none" stroke="white" stroke-width="2"/>
  <line x1="114" y1="78" x2="118" y2="82" stroke="white" stroke-width="2"/>
  
  <!-- Phone icon -->
  <rect x="92" cy="95" width="16" height="25" rx="2" fill="white" opacity="0.9"/>
  <rect x="94" y="97" width="12" height="18" fill="#1E3A5F"/>
  <circle cx="100" cy="118" r="2" fill="#1E3A5F"/>
  <!-- WiFi signal -->
  <path d="M 100 105 Q 97 102, 97 100" fill="none" stroke="#E67E50" stroke-width="1.5"/>
  <path d="M 100 105 Q 103 102, 103 100" fill="none" stroke="#E67E50" stroke-width="1.5"/>
  
  <!-- LipiSathi text -->
  <text x="100" y="155" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1E3A5F" text-anchor="middle">LipiSathi</text>
  <text x="100" y="172" font-family="Arial" font-size="10" fill="url(#textGradient)" text-anchor="middle" letter-spacing="1">INTERNET FREE TRANSLITERATION</text>
</svg>
